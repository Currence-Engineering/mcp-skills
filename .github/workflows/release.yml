name: Release skills

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip each skill
        run: |
          mkdir dist
          cd skills
          for dir in */; do
            name="${dir%/}"
            zip -r "../dist/${name}.zip" "$name" -x '*.DS_Store'
          done
          zip -r ../dist/currence-skills-all.zip . -x '*.DS_Store'

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes
